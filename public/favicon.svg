<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none">

  <!-- Navy badge background -->
  <rect width="56" height="56" rx="13" fill="#0b1d3a"/>

  <!-- Roof with eave overhang -->
  <path d="M8,26 L28,8 L48,26"
    stroke="#C9A84C" stroke-width="3.5"
    stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Body -->
  <rect x="10" y="25.5" width="36" height="26.5" rx="0.5"
    stroke="#C9A84C" stroke-width="3.5" fill="none"/>

  <!-- Arched entrance door -->
  <path d="M21,52 L21,43 A7,7 0 0,0 35,43 L35,52"
    stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Finial gem at apex -->
  <circle cx="28" cy="8" r="4" fill="#E8C870"/>
  <circle cx="28" cy="8" r="1.8" fill="white" opacity="0.85"/>

</svg>
